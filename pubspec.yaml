name: familly_blog
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  timeago: ^3.7.1
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/splash/splash_logo.png
# ─── 1. ICÔNE DE L'APPLICATION (Sur l'écran d'accueil du téléphone) ───
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# ─── 2. ÉCRAN DE DÉMARRAGE (SPLASH SCREEN) ───
flutter_native_splash:
  android: true
  ios: false
  web: false

  background_image: "assets/splash/splash_logo.png"

  fullscreen: true

  android_12:
    color: "#F8F9E8"
